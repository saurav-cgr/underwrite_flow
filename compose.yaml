name: underwriteflow

x-provider-environment: &provider-environment
  GENERATION_PROVIDER: ${GENERATION_PROVIDER:-gemini}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  GENERATION_MODEL: ${GENERATION_MODEL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_NO_TRAINING_ACKNOWLEDGED: >-
    ${GEMINI_NO_TRAINING_ACKNOWLEDGED:-false}
  PROVIDER_ALLOWED_HOSTS:
  PII_REDACTION_TERMS: ${PII_REDACTION_TERMS:-[]}
  PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-30}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}

services:
  db:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "port=5433"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-underwriteflow}
      POSTGRES_USER: ${POSTGRES_USER:-underwriteflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic-local-password}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -p 5433 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bootstrap:
    build:
      context: ./api
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python -m underwriteflow.products.import_configs &&
        python -m underwriteflow.knowledge.import_corpora
    environment:
      <<: *provider-environment
      ENVIRONMENT_MODE: ${ENVIRONMENT_MODE:-development}
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://underwriteflow:\
        synthetic-local-password@db:5433/underwriteflow}"
      SESSION_SECRET: ${SESSION_SECRET:-synthetic-local-session-secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./knowledge-config:/app/knowledge-config:ro
      - ./product-config:/app/product-config:ro
      - ./data/regulatory:/app/data/regulatory:ro

  api:
    build:
      context: ./api
    command:
      - uvicorn
      - underwriteflow.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *provider-environment
      ENVIRONMENT_MODE: ${ENVIRONMENT_MODE:-development}
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://underwriteflow:\
        synthetic-local-password@db:5433/underwriteflow}"
      SESSION_SECRET: ${SESSION_SECRET:-synthetic-local-session-secret}
      JWT_ISSUER: ${JWT_ISSUER:-underwriteflow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-underwriteflow-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-28800}
      REFRESH_TOKEN_PEPPER: "${REFRESH_TOKEN_PEPPER:-synthetic-local-\
        refresh-pepper}"
      PROVIDER_RETRY_COUNT: ${PROVIDER_RETRY_COUNT:-2}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: >-
        ${LANGSMITH_ENDPOINT:-https://apac.api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-underwriteflow-local}
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(('localhost', 8000), 2).close()
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./Makefile:/Makefile:ro
      - ./compose.yaml:/compose.yaml:ro
      - ./compose.evaluation.yaml:/compose.evaluation.yaml:ro
      - ./compose.production.yaml:/compose.production.yaml:ro
      - ./evaluation:/app/evaluation:ro
      - ./knowledge-config:/app/knowledge-config:ro
      - ./product-config:/app/product-config:ro
      - ./data/regulatory:/app/data/regulatory
      - ./scripts:/app/scripts:ro
      - uploads_data:/data/uploads

  langgraph-dev:
    build:
      context: ./api
      dockerfile: Dockerfile.langgraph-dev
    command:
      - langgraph
      - dev
      - --config
      - /app/langgraph.json
      - --host
      - 0.0.0.0
      - --port
      - "2024"
      - --no-browser
    environment:
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: https://apac.api.smith.langchain.com
      LANGSMITH_PROJECT: underwriteflow-langgraph-dev
      LANGSMITH_TRACING: "true"
    profiles: ["langgraph-dev"]
    ports:
      - "2024:2024"
    volumes:
      - ./api:/app
      - ./product-config:/app/product-config:ro

  web:
    build:
      context: ./web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:5173').then(r => {
          if (!r.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  web-e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci --ignore-scripts && npx playwright test
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    profiles: ["e2e"]
    volumes:
      - ./web:/app
      - web_e2e_node_modules:/app/node_modules

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
  postgres_data:
  uploads_data:
  web_node_modules:
  web_e2e_node_modules:
