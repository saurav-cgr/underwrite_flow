name: underwriteflow

services:
  db:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "port=5433"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-underwriteflow}
      POSTGRES_USER: ${POSTGRES_USER:-underwriteflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic-local-password}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -p 5433 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bootstrap:
    build:
      context: ./api
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python -m underwriteflow.products.import_configs
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://underwriteflow:synthetic-local-password@db:5433/underwriteflow}
      SESSION_SECRET: ${SESSION_SECRET:-synthetic-local-session-secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./product-config:/app/product-config:ro

  api:
    build:
      context: ./api
    command:
      - uvicorn
      - underwriteflow.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://underwriteflow:synthetic-local-password@db:5433/underwriteflow}
      SESSION_SECRET: ${SESSION_SECRET:-synthetic-local-session-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-900}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-30}
      PROVIDER_RETRY_COUNT: ${PROVIDER_RETRY_COUNT:-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: >-
        ${LANGSMITH_ENDPOINT:-https://apac.api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-underwriteflow-local}
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(('localhost', 8000), 2).close()
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./evaluation:/app/evaluation:ro
      - ./product-config:/app/product-config:ro
      - ./scripts:/app/scripts:ro
      - uploads_data:/data/uploads

  langgraph-dev:
    build:
      context: ./api
    command:
      - langgraph
      - dev
      - --config
      - /app/langgraph.json
      - --host
      - 0.0.0.0
      - --port
      - "2024"
      - --no-browser
    environment:
      LANGSMITH_TRACING: "false"
    profiles: ["langgraph-dev"]
    ports:
      - "2024:2024"
    volumes:
      - ./api:/app
      - ./product-config:/app/product-config:ro

  web:
    build:
      context: ./web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
  postgres_data:
  uploads_data:
  web_node_modules:
