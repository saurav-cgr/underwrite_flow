product_code: life-individual-term
title: Fictional Individual Term Life
family: life
scope: Fictional India-focused demonstration only
description: >-
  Demonstration triage configuration for individual term life.
version: v2
status: draft
fields:
  - key: requested_cover
    label: Requested cover
    type: number
    required: true
    help_text: Enter the fictional requested cover amount.
    validation: {minimum: 1}
  - key: occupation_type
    label: Occupation type
    type: enum
    required: true
    help_text: Select the fictional occupation category.
    options: [office, field, hazardous]
  - key: health_declaration
    label: Health declaration
    type: boolean
    required: true
    help_text: Confirm the fictional health declaration is complete.
  - key: cover_start_date
    label: Cover start date
    type: date
    required: false
    help_text: Enter the fictional cover start date.
documents:
  - code: identity_record
    title: Synthetic identity record
    requirement: required
    accepted_types: [application/pdf, image/jpeg, image/png]
  - code: income_record
    title: Synthetic income record
    requirement: conditional
    condition:
      field: requested_cover
      operator: greater_than
      value: 10000000
    accepted_types: [application/pdf]
  - code: health_statement
    title: Synthetic health statement
    requirement: conditional
    condition: {field: health_declaration, operator: equals, value: false}
    accepted_types: [application/pdf, image/jpeg, image/png]
  - code: previous_policy
    title: Synthetic previous policy
    requirement: optional
    accepted_types: [application/pdf, image/jpeg, image/png]
routing_rules:
  - code: hazardous_occupation_specialist
    condition: {field: occupation_type, operator: equals, value: hazardous}
    route: specialist
    specialist_label: life review
  - code: high_cover_standard
    condition:
      field: requested_cover
      operator: greater_than
      value: 10000000
    route: standard
# Fictional checks only. Every comparison stays in backend code.
reconciliations:
  - code: life_identity_match
    kind: asset_match
    inputs:
      identity_record: holder_name
      income_record: holder_name
  - code: life_renewal_lapse
    kind: policy_lapse
    inputs:
      application: cover_start_date
      previous_policy: policy_expiry_date
    parameters:
      maximum_gap_days: 30
      boundary: inclusive
specialist_labels: [life review]
