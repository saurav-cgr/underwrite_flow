product_code: health-individual-family-floater
title: Fictional Individual and Family Floater Health
family: health
scope: Fictional India-focused demonstration only
description: >-
  Demonstration triage configuration for individual and family floater health.
version: v3
status: draft
supported_journeys: [new_business, renewal]
fields:
  - key: member_count
    label: Covered member count
    type: integer
    required: true
    help_text: Enter the fictional number of covered members.
    validation: {minimum: 1, maximum: 8}
    applies_to: [new_business, renewal]
  - key: prior_hospitalization
    label: Prior hospitalization
    type: boolean
    required: true
    help_text: Indicate whether fictional prior hospitalization exists.
    applies_to: [new_business, renewal]
  - key: continuity_months
    label: Continuity months
    type: integer
    required: false
    help_text: Enter fictional continuity months when applicable.
    visible_when: {field: prior_hospitalization, equals: true}
    validation: {minimum: 0}
    applies_to: [new_business, renewal]
  - key: policy_start_date
    label: Policy start date
    type: date
    required: true
    help_text: Enter the fictional renewal start date.
    applies_to: [renewal]
documents:
  - code: identity_record
    title: Synthetic identity record
    requirement: required
    accepted_types: [application/pdf, image/jpeg, image/png]
    applies_to: [new_business, renewal]
  - code: member_relationship_record
    title: Synthetic member relationship record
    requirement: conditional
    condition: {field: member_count, operator: greater_than, value: 1}
    accepted_types: [application/pdf, image/jpeg, image/png]
    applies_to: [new_business, renewal]
  - code: hospitalization_record
    title: Synthetic hospitalization record
    requirement: conditional
    condition:
      field: prior_hospitalization
      operator: equals
      value: true
    accepted_types: [application/pdf, image/jpeg, image/png]
    applies_to: [new_business, renewal]
  - code: previous_policy
    title: Synthetic previous policy
    requirement: required
    accepted_types: [application/pdf, image/jpeg, image/png]
    applies_to: [renewal]
    required_for: [renewal]
    stage: prior_policy
routing_rules:
  - code: prior_hospitalization_specialist
    condition:
      field: prior_hospitalization
      operator: equals
      value: true
    route: specialist
    specialist_label: health review
    applies_to: [new_business, renewal]
  - code: large_floater_standard
    condition: {field: member_count, operator: greater_than, value: 4}
    route: standard
    applies_to: [new_business, renewal]
# Fictional checks only. Every comparison stays in backend code.
reconciliations:
  - code: health_identity_match
    kind: asset_match
    inputs:
      identity_record: holder_name
      member_relationship_record: holder_name
    applies_to: [new_business, renewal]
  - code: health_renewal_lapse
    kind: policy_lapse
    inputs:
      application: policy_start_date
      previous_policy: policy_expiry_date
    parameters:
      maximum_gap_days: 30
      boundary: inclusive
    applies_to: [renewal]
specialist_labels: [health review]
