[alembic]
script_location = alembic
prepend_sys_path = .
database.authority = underwriteflow:synthetic-local-password@db:5433
sqlalchemy.url = postgresql+asyncpg://%(database.authority)s/underwriteflow

# Run env.py for `alembic revision` so the numbering hook in env.py applies.
revision_environment = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
